# Default values for distribution.
# This is a YAML-formatted file.

image:
  repository: distribution/distribution
  tag: ""  # defaults to appVersion in Chart.yaml if unset
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

replicaCount: 1

# -- Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
  # customMetrics:
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: registry_requests_per_second
  #       target:
  #         type: AverageValue
  #         averageValue: 1000

# -- Configuration for the distribution registry
# See: https://github.com/distribution/distribution/blob/main/cmd/registry/config-example.yml
config:
  version: 0.1
  log:
    level: info  # debug, info, warn, error, fatal
    fields:
      service: registry
