# -- Override config with a raw YAML string (takes precedence over config field above)
# configOverride: ""

# -- Extra config files to mount as secrets
# extraConfigFiles:
#   storage-config.yml: |
#     ...

# -- Registry configuration as a secret (for sensitive values like auth credentials)
secretConfig:
  # Create a secret from the values below and mount it
  enabled: false
  # htpasswd:
  #   realm: basic-realm
  #   path: /etc/registry/auth.htpasswd

service:
  type: ClusterIP
  port: 5000
  # targetPort: 5000
  # nodePort: null
  # hostPort: 5000  # Only set if you need the registry on the host network
  # annotations: {}
  # labels: {}
  # loadBalancerIP: ""
  # externalTrafficPolicy: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  #   nginx.ingress.kubernetes.io/proxy-body-size: "0"
  #   nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: registry.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: registry-tls
  #    hosts:
  #      - registry.example.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  # limits:
  #   cpu: 500m
  #   memory: 512Mi

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# -- Startup probe configuration
startupProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 10

# -- Pod annotations
podAnnotations: {}

# -- Pod labels
podLabels: {}

# -- Extra environment variables
extraEnvs: []
# - name: FOO
#   value: bar

# -- Extra environment variables from secrets/configmaps
extraEnvFrom: []
# - secretRef:
#     name: registry-env
# - configMapRef:
#     name: registry-env

# -- Extra volumes
extraVolumes: []
# - name: docker-certs
#   secret:
#     secretName: docker-certs

# -- Extra volume mounts
extraVolumeMounts: []
# - name: docker-certs
#   mountPath: /etc/docker/certs.d
#   readOnly: true

# -- Extra containers
extraContainers: []
# - name: envsidecar
#   image: busybox
#   command: ['sh', '-c', 'while true; do echo "still running"; sleep 5; done']

# -- Node selectors
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity
affinity: {}

# -- Topology spread constraints
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: kubernetes.io/hostname
#   whenUnsatisfiable: DoNotSchedule
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: distribution

# -- Priority class name
priorityClassName: ""

# -- Init containers
initContainers: []
# - name: init-config
#   image: busybox
#   command: ['sh', '-c', 'cp /config/* /etc/registry/']
#   volumeMounts:
#     - name: config
#       mountPath: /config
#     - name: registry-config
#       mountPath: /etc/registry

# -- Health check endpoint for the registry
healthCheckPath: "/"

# -- Metrics endpoint (exposed via debug port)
metrics:
  enabled: false
  service:
    port: 5001
    type: ClusterIP

# -- TLS secrets for the registry (if not using ingress)
tls:
  enabled: false
  # secretName: registry-tls  # Must reference an existing secret with tls.crt and tls.key

# -- PVC for registry data
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  # annotation: {}
  # accessMode: ReadWriteOnce
  mountPath: /var/lib/registry
