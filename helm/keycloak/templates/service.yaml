{{- range .Values.services}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }} 
  labels:
    app: {{ $.Values.app }}
spec:
  type: ClusterIP
  ports:
  - name: {{ .name }}
    protocol: {{ .protocol }}
    port: {{ .port }}
    #targetPort:
  selector:
    app: {{ .targetDeployment }}
{{- end }}
