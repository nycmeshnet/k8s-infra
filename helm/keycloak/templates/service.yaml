{{- range .Values.services}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }} 
  labels:
    app: {{ $.Values.app }}
spec:
  type: ClusterIP
  ports:
  - name: {{ .name }}
    protocol: {{ .protocol }}
    port: {{ .port }}
    #targetPort:
  selector:
    app: {{ .targetDeployment }}

{{ if .addIngress }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    # ingress.kubernetes.io/ssl-redirect: "true"
    spec.ingressClassName: "traefik"
spec:
  entryPoints:
    - web
    - websecure
  tls:
    certResolver: letsencrypt
    domains:
    - main: "*.willard.gay"
      sans:
      - "willard.gay"
  routes:
  - match: Host(`{{ .fqdn }}`)
    kind: Rule
    services:
    - name: {{ .name }}
      port: {{ .port }}
    #middlewares:
    #- name: redirect-to-https
    #  namespace: {{ $.Values.namespace }} 
{{- end }}

{{- end }}
