{{- range .Values.deployments }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .name }}
  replicas: {{ .replicas }}
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      {{- if .securityContext }}
      securityContext: {{ .securityContext | toYaml | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
      - name: {{ .name }}
        image: {{ .image }}

        {{- if .ports }}
        ports:
        {{ .ports | toYaml | nindent 10 }}
        {{- end }}

        {{- if .command }}
        command: {{ .command }}
        {{- end }}

        {{- if .args }}
        args: {{ .args | toYaml | nindent 10 }}
        {{- end }}

        {{- if .secretRef }}
        envFrom:
          - secretRef:
              name: {{ .secretRef }}
        {{- end }}

        {{- if .env }}
        env:
        {{ .env | toYaml | nindent 10 }}
        {{- end }}

        {{- if or .volumes .configMaps }}
        volumeMounts:
        {{- range .volumes }}
        - name: {{ .name }}
          mountPath: {{ .mountPath }}
        {{- end }}
        {{- range .configMaps }}
        - name: {{ .name }}
          mountPath: {{ .mountPath }} 
          readOnly: {{ .readOnly }}
          subPath: {{ .filename }}
        {{- end }}
        {{- end }}

      {{- if or .volumes .configMaps }}
      volumes:
      {{- range .volumes }}
      - name: {{ .name }}
        persistentVolumeClaim:
          claimName: {{ .name }}
      {{- end }}
      {{- range .configMaps }}
      - name: {{ .name }}
        configMap:
          name: {{ .configMapName }}
          items:
          - key: {{ .filename }}
            path:  {{ .filename }}
      {{- end }}
      {{- end }}

{{- end }}
