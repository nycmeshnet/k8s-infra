app: keycloak
namespace: keycloak

services:
- name: keycloak
  protocol: TCP
  port: 8080
  targetDeployment: keycloak
- name: keycloak-admin
  protocol: TCP
  port: 8080
  targetDeployment: keycloak
#- name: keycloak-discovery
#  targetDeployment: keycloak

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: "traefik"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  serviceName: keycloak
  servicePort: 8080
  hosts:
    - host: keycloak.nycmesh.net
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: keycloak-admin.mesh.nycmesh.net
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: keycloak-tls
  #    hosts:
  #      - keycloak.nycmesh.net
  #      - keycloak-admin.mesh.nycmesh.net

middleware:
  enabled: false

statefulsets:
- name: keycloak
  #serviceName: keycloak-discovery
  replicas: 2
  image: quay.io/keycloak/keycloak:26.5.2
  args: ["start", "--hostname", "https://keycloak.nycmesh.net", "--hostname-admin", "https://keycloak-admin.mesh.nycmesh.net"]
  secretRef: keycloak-secrets
  ports:
  - name: http
    containerPort: 8080
  - name: jgroups
    containerPort: 7800
  - name: jgroups-fd
    containerPort: 57800
  startupProbe:
    httpGet:
      path: /health/started
      port: 9000
    periodSeconds: 1
    failureThreshold: 600
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 9000
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /health/live
      port: 9000
    periodSeconds: 10
    failureThreshold: 3
  securityContext:
    runAsUser: 2001
    runAsGroup: 2001

