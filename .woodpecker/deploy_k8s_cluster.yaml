when:
  - evaluate: 'TRIGGER_CLUSTER != "true"'
  - event: push
    branch: main
#  - event: push
#    branch: wdn/charts-and-ci
  - event: manual

#  TF_VAR_env_name:
#    - prod3

matrix:
  ENV: [prod4]

steps:
  - name: deploy k8s cluster
    image: debian:trixie-slim
    environment:
      # Secrets
      TF_VAR_mesh_proxmox_host:
        from_secret: ${ENV}-TF_VAR_mesh_proxmox_host
      TF_VAR_mesh_proxmox_token_id:
        from_secret: ${ENV}-TF_VAR_mesh_proxmox_token_id
      TF_VAR_mesh_proxmox_token_secret:
        from_secret: ${ENV}-TF_VAR_mesh_proxmox_token_secret

      # Generate some passwords for these
      TF_VAR_k3s_token:
        from_secret: ${ENV}-TF_VAR_k3s_token
      TF_VAR_longhorn_passphrase:
        from_secret: ${ENV}-TF_VAR_longhorn_passphrase
      TF_VAR_mesh_local_password:
        from_secret: ${ENV}-TF_VAR_mesh_local_password

      # Required to talk to the DNS to do SSL challenges
      TF_VAR_tsig_key:
        from_secret: TF_VAR_tsig_key
      TF_VAR_tsig_key_name:
        from_secret: TF_VAR_tsig_key_name
      TF_VAR_tsig_main_dns_ip:
        from_secret: TF_VAR_tsig_main_dns_ip

      # Credentials for deployment to AWS
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID_INFRA
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY_INFRA

      # S3 bucket for the Terraform state
      BUCKET_TF_STATE:
        from_secret: BUCKET_TF_STATE

      TF_VAR_env_name: ${ENV}

      # SSH Keys (generate these and apply them as secrets)
      SSH_PRIVATE_KEY:
        from_secret: ${ENV}-SSH_PRIVATE_KEY
      SSH_PUBLIC_KEY:
        from_secret: ${ENV}-SSH_PUBLIC_KEY

    commands:
      - echo "Alright chat let's deploy a koobe cluster"
      - apt-get update
      # Download and install ansible and other deps
      - apt-get -y install python3 python3-pip ansible wget gpg

      # Download and install terraform
      - wget -O - https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(grep -oP '(?<=UBUNTU_CODENAME=).*' /etc/os-release || lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list
      - apt-get update && apt-get install -y terraform

      # Terraform setup / apply
      - cd terraform
      - |
        echo "bucket = \"$BUCKET_TF_STATE\"" > backend.tfvars
        echo "key    = \"terraform/state/k8s-infra-$ENV.tfstate\"" >> backend.tfvars
      - terraform init -backend-config=backend.tfvars
      - terraform fmt -check
      - terraform validate
      - |
        echo "$SSH_PRIVATE_KEY" > mesh_cluster/mesh$ENV
        echo "$SSH_PUBLIC_KEY" > mesh_cluster/mesh$ENV.pub
        chmod 600 mesh_cluster/mesh$ENV
        chmod 600 mesh_cluster/mesh$ENV.pub
        terraform apply -auto-approve -input=false -var-file=$ENV.tfvars

      # Run Ansible
      - cd ../ansible
      - export PATH="$HOME/.local/bin:$PATH"
      - sleep 20 && ansible-playbook -i inventory.yaml k8s_infra.yaml -vvvv
