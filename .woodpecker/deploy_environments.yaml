when:
  - evaluate: 'TRIGGER_CLUSTER != "true"'
  - event: push
    branch: wdn/charts-and-ci


steps:
  - name: deploy prodtest
    image: woodpeckerci/plugin-trigger
    settings:
      repositories:
        - nycmeshnet/k8s-infra@wdn/charts-and-ci
      deploy: deploy_cluster
      params:
        - TRIGGER_CLUSTER=true
        - ENV=prodtest
      token:
        from_secret: woodpecker_token
  - name: bye bye
    image: debian:trixie-slim
    commands:
      - echo "Thank you for choosing Willard Cloud™"
